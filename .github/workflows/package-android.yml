name: Package Android

# App 分支 = Kivio 安卓端：只在 App 分支的提交上跑，产出 APK。
# Linux 分支的打包在 package-linux.yml，两边按分支完全分开、互不触发
# （各自的 push 过滤都只看自己那条分支，另有 job 级 github.ref 守卫）。
#
# 与桌面端的差异（见 src-tauri/src/android.rs 的模块注释）：
#   托盘 / 全局热键 / 单实例 / 开机自启 / 多窗口 / Dock 终端 / Lens 浮层 /
#   离线 RapidOCR 全部不参与编译。首版只出 debug APK（Gradle 自动用 debug
#   keystore 签名，可直接安装）；release APK 需要签名 secrets，另开一步做。
#
# Android 工程（src-tauri/gen/android）由 `tauri android init` 在本流程生成，
# 不入库：它含二进制 gradle-wrapper.jar，每次由 CLI 生成更可靠。

on:
  push:
    branches: [App]
    # 只有会改变 APK 的提交才重新打包（与 package-linux.yml 同一套白名单思路）。
    # 额外带上本文件自身：安卓端还在搭建期，改流水线必须能立刻自测；
    # 稳定后可以像 package-linux.yml 那样把它去掉，只留 workflow_dispatch。
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'postcss.config.cjs'
      - '.eslintrc.cjs'
      - 'architecture-boundaries.json'
      - 'scripts/**'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/package-android.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'debug(默认,免签名) 或 release(需要签名 secrets)'
        required: false
        default: 'debug'

concurrency:
  group: package-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  NDK_VERSION: '27.0.12077973'
  JAVA_VERSION: '17'

jobs:
  apk:
    # 打包按分支分开：App 分支只出 APK；Linux 分支的提交永不触发这里。
    if: github.ref == 'refs/heads/App'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 不用 android-actions/setup-android：它默认执行 `sdkmanager 'tools'`，而
      # `tools` 包早已从 Google 的 SDK 仓库下架（"Failed to find package 'tools'"），
      # 整步直接失败。这里自己装 cmdline-tools，装哪些包完全由本文件决定。
      - name: Set up Android SDK (cmdline-tools)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # platform 34/35 都装上：Tauri 模板的 compileSdk 随 CLI 版本变化，多装一个
      # 不影响，缺了却要在 Gradle 阶段才报错。NDK 版本以 tauri.properties /
      # templates 的 ndkVersion 为准，不一致时 AGP 会自行下载（licenses 已接受）。
      - name: Install Android NDK and platform packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # rootfs 工作区素材：proot / proot-loader / libtalloc / libandroid-shmem /
      # Alpine minirootfs。二进制不入库（见 .gitignore），构建前现拉；
      # Rust 侧用 include_bytes! 打进 so（src-tauri/src/android_rootfs.rs）。
      - name: Fetch Android rootfs assets
        run: bash scripts/fetch-android-rootfs.sh

      # tauri-build 的 build.rs 会校验 externalBin 与 frontendDist 存在性；
      # 真正的 dist 由 beforeBuildCommand 生成，这里先放空壳让构建脚本通过。
      # 安卓不需要 OCR sidecar，但校验只看文件名，四个 ABI 名都补上空文件。
      - name: Stub sidecar binary and frontend dist
        run: |
          mkdir -p dist src-tauri/binaries
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            : > "src-tauri/binaries/kivio-ocr-helper-$t"
            chmod +x "src-tauri/binaries/kivio-ocr-helper-$t"
          done

      # 把 CLI 支持的参数打进日志，命令形式不对时不用等下一轮才发现。
      - name: Show android CLI options
        run: |
          npx tauri android init --help || true
          npx tauri android build --help || true

      - name: Init Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Install exec assets into jniLibs and patch manifest
        run: bash scripts/install-android-jni-libs.sh

      - name: Build debug APK (arm64)
        run: |
          npx tauri android build --apk --debug --target aarch64

      - name: List APK outputs
        if: always()
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: kivio-android-arm64-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
