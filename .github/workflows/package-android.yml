name: Package Android

# App 分支 = Kivio 安卓端：只在 App 分支的提交上跑，产出 APK。
# Linux 分支的打包在 package-linux.yml，两边按分支完全分开、互不触发
# （各自的 push 过滤都只看自己那条分支，另有 job 级 github.ref 守卫）。
#
# 与桌面端的差异（见 src-tauri/src/android.rs 的模块注释）：
#   托盘 / 全局热键 / 单实例 / 开机自启 / 多窗口 / Dock 终端 / Lens 浮层 /
#   离线 RapidOCR 全部不参与编译。
#
# 两种产物，按触发方式自动区分：
#   push 到 App 分支      → debug 包（快速自测，artifact: ...-debug-apk）
#   push tag v*-app       → 正式版（release buildType + kivio-signing.jks 签名，
#                           artifact: ...-release-apk，并自动发到该 tag 的 Release）
#   workflow_dispatch     → 手动选 build_mode（默认 debug）
# 版本号唯一来源：src-tauri/tauri.android.conf.json（安卓端独立版本线，
# 桌面端的 3.1.x 在 tauri.conf.json 里不受影响）。
#
# Android 工程（src-tauri/gen/android）由 `tauri android init` 在本流程生成，
# 不入库：它含二进制 gradle-wrapper.jar，每次由 CLI 生成更可靠。

on:
  push:
    branches: [App]
    # 打 tag 即发正式版；tag push 不评估 paths 过滤，必定触发。
    tags:
      - 'v*-app'
    # 只有会改变 APK 的提交才重新打包（与 package-linux.yml 同一套白名单思路）。
    # 额外带上本文件自身：安卓端还在搭建期，改流水线必须能立刻自测；
    # 稳定后可以像 package-linux.yml 那样把它去掉，只留 workflow_dispatch。
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'postcss.config.cjs'
      - '.eslintrc.cjs'
      - 'architecture-boundaries.json'
      - 'scripts/**'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/package-android.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'debug(默认,快速自测) 或 release(正式版,自动发 Release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: package-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 打 tag 的正式版流程要用 GITHUB_TOKEN 建 Release / 上传附件
  contents: write

env:
  NODE_VERSION: '20'
  NDK_VERSION: '27.0.12077973'
  JAVA_VERSION: '17'
  # 手动触发用输入；tag 触发一律正式版；普通分支 push 一律 debug。
  BUILD_MODE: ${{ github.event.inputs.build_mode || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}

jobs:
  apk:
    # 打包按分支分开：App 分支只出 APK；Linux 分支的提交永不触发这里。
    if: github.ref == 'refs/heads/App' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 不用 android-actions/setup-android：它默认执行 `sdkmanager 'tools'`，而
      # `tools` 包早已从 Google 的 SDK 仓库下架（"Failed to find package 'tools'"），
      # 整步直接失败。这里自己装 cmdline-tools，装哪些包完全由本文件决定。
      - name: Set up Android SDK (cmdline-tools)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # platform 34/35 都装上：Tauri 模板的 compileSdk 随 CLI 版本变化，多装一个
      # 不影响，缺了却要在 Gradle 阶段才报错。NDK 版本以 tauri.properties /
      # templates 的 ndkVersion 为准，不一致时 AGP 会自行下载（licenses 已接受）。
      - name: Install Android NDK and platform packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # rootfs 工作区素材：proot / proot-loader / libtalloc / libandroid-shmem /
      # Alpine minirootfs。二进制不入库（见 .gitignore），构建前现拉；
      # Rust 侧用 include_bytes! 打进 so（src-tauri/src/android_rootfs.rs）。
      - name: Fetch Android rootfs assets
        run: bash scripts/fetch-android-rootfs.sh

      # tauri-build 的 build.rs 会校验 externalBin 与 frontendDist 存在性；
      # 真正的 dist 由 beforeBuildCommand 生成，这里先放空壳让构建脚本通过。
      # 安卓不需要 OCR sidecar，但校验只看文件名，四个 ABI 名都补上空文件。
      - name: Stub sidecar binary and frontend dist
        run: |
          mkdir -p dist src-tauri/binaries
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            : > "src-tauri/binaries/kivio-ocr-helper-$t"
            chmod +x "src-tauri/binaries/kivio-ocr-helper-$t"
          done

      # 把 CLI 支持的参数打进日志，命令形式不对时不用等下一轮才发现。
      - name: Show android CLI options
        run: |
          npx tauri android init --help || true
          npx tauri android build --help || true

      - name: Generate launcher icons from project logo
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Init Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Install exec assets into jniLibs and patch manifest
        run: bash scripts/install-android-jni-libs.sh

      # 版本号单一来源：src-tauri/tauri.android.conf.json 是 Tauri v2 的平台配置，
      # 安卓构建时覆盖 tauri.conf.json 的 version，桌面端的 3.1.x 不受影响。
      - name: Read Android version
        id: ver
        run: |
          set -euo pipefail
          V=$(node -p "require('./src-tauri/tauri.android.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "安卓端版本 = $V（构建模式 ${BUILD_MODE}）"

      # 只出一份包：release 走 gradle 的 release buildType（install-android-jni-libs.sh
      # 已把 kivio-signing.jks 注入 signingConfigs.release），debug 保留作快速自测。
      - name: Build APK (arm64, ${{ env.BUILD_MODE }})
        run: |
          set -euo pipefail
          if [ "${BUILD_MODE}" = "release" ]; then
            echo "→ 正式版构建（kivio-signing.jks 签名）"
            npx tauri android build --apk --target aarch64 --config src-tauri/tauri.android.conf.json
          else
            echo "→ debug 构建"
            npx tauri android build --apk --debug --target aarch64 --config src-tauri/tauri.android.conf.json
          fi

      # 产物统一改名落到 out/：正式版 = kivio-<版本>-arm64-release.apk
      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          # tauri android build --apk（不带 --split-per-abi）产物在 apk/universal/<buildtype>/
          SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path "*/${BUILD_MODE}/*" | head -1)
          test -n "$SRC" || { echo "::error::找不到 ${BUILD_MODE} APK"; exit 1; }
          mkdir -p out
          NAME="kivio-${VERSION}-arm64-${BUILD_MODE}.apk"
          cp "$SRC" "out/$NAME"
          echo "path=out/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ( cd out && sha256sum "$NAME" > ../SHA256SUMS.txt )
          echo "APK = out/$NAME ($(stat -c %s "out/$NAME") bytes)"

      # 签名与版本自证：证书必须是仓库那把 kivio，versionName 必须等于 tauri.android.conf.json
      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK="${{ steps.apk.outputs.path }}"
          "$BT/apksigner" verify --print-certs "$APK"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          VN=$(echo "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          VC=$(echo "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
          echo "versionName=$VN versionCode=$VC"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          if [ "$VN" != "${VERSION}" ]; then
            echo "::error::versionName=$VN 与 tauri.android.conf.json=${VERSION} 不一致"
            exit 1
          fi
          cat SHA256SUMS.txt

      - name: List APK outputs
        if: always()
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: kivio-android-arm64-${{ env.BUILD_MODE }}-apk
          path: |
            out/*.apk
            SHA256SUMS.txt
          if-no-files-found: error

      # 打 tag（v*-app）才发正式版：把 out/ 里的正式包挂到该 tag 的 Release 上。
      # 已存在同名 Release 时只替换附件，不重建（tag 唯一，见 Release 与 tag 的一对一约束）。
      - name: Publish GitHub Release
        if: success() && env.BUILD_MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="${{ steps.apk.outputs.path }}"
          {
            echo "Kivio 安卓端正式版 $TAG"
            echo
            echo "## 安装"
            echo "- 架构：arm64-v8a"
            echo "- 签名：\`kivio-signing.jks\`（与 debug 包同一把，可直接覆盖升级）"
            echo "- 首次安装需在系统设置里给 Kivio 授予「所有文件访问」，rootfs 才能解压运行"
            echo
            echo "## 构建"
            echo "- 版本：$VERSION（versionCode ${VERSION_CODE:-1}）"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 流水线：[run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "## 校验"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ Release $TAG 已存在，替换附件"
            gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            echo "→ 创建 Release $TAG"
            gh release create "$TAG" "$APK" SHA256SUMS.txt --title "Kivio Android $TAG" --notes-file notes.md --latest=false
          fi
