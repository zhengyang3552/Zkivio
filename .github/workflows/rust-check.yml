# Rust/Tauri 侧门禁:仅在 src-tauri 变更时触发,cargo test 作门禁
# (完整 tauri build 仍在本地/发布流程)。
name: Rust

on:
  push:
    branches: [Linux]
    # 工作流文件自身也在触发面里:改工作流(如桩步骤)能立即自测,
    # 否则要等下一次 src-tauri 变更才暴露问题。
    paths: ['src-tauri/**', '.github/workflows/rust-check.yml']
  pull_request:
    branches: [Linux]
    paths: ['src-tauri/**', '.github/workflows/rust-check.yml']
  # GITHUB_TOKEN 的 push 不触发其他工作流（防递归），fix-lockfile 提交回的
  # Cargo.lock 无法自动唤起本门禁——补一个手动入口。
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          # 防 apt 静默挂死:保留完整日志;等锁最多 120s(超时报错而不是无限等);
          # 关交互提示;停掉后台 unattended-upgrades 防抢锁
          APT="sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get"
          sudo systemctl stop unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          $APT update
          # zsh: shell_resolution_unix 测试以 /bin/zsh 为候选断言登录 shell 优先级,
          # ubuntu runner 默认不装 zsh,缺了会回退 /bin/bash 导致断言失败。
          $APT install -y -o DPkg::Lock::Timeout=120 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev zsh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build 的 build.rs 会校验 externalBin sidecar 与 frontendDist 存在性,
      # cargo test 不需要真产物,放空壳即可。
      # (kivio-ocr-helper 真实实现仅 macOS,Linux 下为空 stub,运行时按平台禁用)
      - name: Stub sidecar binary and frontend dist
        run: |
          mkdir -p dist
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/kivio-ocr-helper-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/kivio-ocr-helper-x86_64-unknown-linux-gnu

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
